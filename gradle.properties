#Gradle
org.gradle.jvmargs=-Xmx6048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#App build parameters, read by build-logic ConventionBasePluginExtension.
#Override per invocation with -PserverEnv=dev|stage|prod, -PisDebug=..., -PenableLogs=...
#Xcode builds override them from iosApp/Configuration/*.xcconfig.
serverEnv=dev
isDebug=true
enableLogs=true
#Kotlin
kotlin.code.style=official
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
